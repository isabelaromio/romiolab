<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Romio Lab 3D — Central de Produção</title>
<base target="_top">
<style>
@import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap');

:root {
  --bg: #0B1220;
  --bg-elevated: #0D1626;
  --surface: #111B2E;
  --surface-2: #16223A;
  --border: #1E2B47;
  --border-soft: #182238;
  --cobalt: #2F7FE0;
  --cobalt-dark: #1F5FB3;
  --cobalt-soft: rgba(47,127,224,0.14);
  --amber: #D97706;
  --amber-soft: rgba(217,118,6,0.12);
  --amber-text: #F0A94E;
  --text: #E4EAF5;
  --text-dim: #9FB0CB;
  --text-faint: #6C7B99;
  --danger: #E4536B;
  --silver-1: #F4F6F9;
  --silver-2: #C7CDD9;
  --silver-3: #8A93A6;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background:
    radial-gradient(1200px 600px at 15% -10%, rgba(47,127,224,0.10), transparent 60%),
    radial-gradient(900px 500px at 110% 10%, rgba(217,118,6,0.05), transparent 60%),
    var(--bg);
  color: var(--text);
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}
.font-display { font-family: 'Rajdhani', sans-serif; letter-spacing: 0.02em; }
.font-num { font-family: 'JetBrains Mono', monospace; font-variant-numeric: tabular-nums; }
::-webkit-scrollbar { height: 6px; width: 6px; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

.wrap { max-width: 1120px; margin: 0 auto; padding: 0 16px; }
@media (min-width: 768px) { .wrap { padding: 0 24px; } }

/* icons */
.icon { width:16px; height:16px; flex-shrink:0; display:inline-block; vertical-align:middle; }
.icon-sm { width:14px; height:14px; }
.icon-md { width:20px; height:20px; }
.icon-lg { width:26px; height:26px; }
.icon-xl { width:44px; height:44px; }

/* header */
.app-header { border-bottom: 1px solid var(--border); background: var(--bg-elevated); box-shadow: 0 1px 0 rgba(47,127,224,0.15); }
.app-header-inner { display:flex; flex-direction:column; gap:16px; padding:18px 0; }
@media (min-width:768px) { .app-header-inner { flex-direction:row; align-items:center; justify-content:space-between; } }
.brand { display:flex; align-items:center; gap:12px; }
.brand-mark { width:46px; height:46px; border-radius:12px; background:linear-gradient(160deg,#141f34,#0a0f1c); border:1px solid var(--cobalt); display:flex; align-items:center; justify-content:center; flex-shrink:0; box-shadow:0 0 0 1px rgba(47,127,224,0.15), 0 4px 16px rgba(47,127,224,0.3); }
.brand-mark span { font-family:'Rajdhani',sans-serif; font-weight:700; font-size:23px; }
.brand-name-row { display:flex; align-items:baseline; gap:6px; }
.brand-name { font-family:'Rajdhani',sans-serif; font-weight:700; font-size:22px; letter-spacing:0.03em; line-height:1; text-transform:uppercase; }
.brand-name .metal { }
.brand-sub-title { display:block; font-size:11px; letter-spacing:0.14em; color:var(--text-dim); font-weight:600; margin-top:4px; text-transform:uppercase; }
.brand-tagline { font-size:11px; color:var(--text-faint); margin-top:2px; letter-spacing:0.02em; }

.machine-row { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.machine-pill { display:flex; align-items:center; gap:8px; background:var(--surface); border:1px solid var(--border); border-radius:999px; padding:6px 12px 6px 8px; }
.status-dot { width:8px; height:8px; border-radius:999px; flex-shrink:0; box-shadow:0 0 6px currentColor; }
.machine-pill .name { font-size:12px; font-weight:600; color:var(--text-dim); }

/* nav */
.tab-nav { background: var(--bg-elevated); border-bottom:1px solid var(--border); position:sticky; top:0; z-index:10; }
.tab-nav-inner { display:flex; gap:2px; overflow-x:auto; }
.tab-btn { position:relative; display:flex; align-items:center; gap:8px; padding:14px 16px; font-size:13px; font-weight:600; white-space:nowrap; border:none; background:none; cursor:pointer; color:var(--text-dim); border-bottom:2px solid transparent; font-family:'Inter',sans-serif; transition:color .15s, border-color .15s; }
.tab-btn:hover { color:var(--text); }
.tab-btn.active { color:var(--cobalt); border-bottom-color:var(--cobalt); }
.tab-badge { position:absolute; top:6px; right:2px; width:16px; height:16px; border-radius:999px; background:var(--amber); color:#1a1206; font-size:10px; display:flex; align-items:center; justify-content:center; font-weight:700; }

main.content { padding: 24px 0 96px; }

/* cards */
.card { background:var(--surface); border:1px solid var(--border); border-radius:16px; }
.card-pad { padding:20px; }
.card-header { padding:16px 20px; border-bottom:1px solid var(--border-soft); }
.card-title { font-family:'Rajdhani',sans-serif; font-weight:700; font-size:15px; letter-spacing:.02em; margin:0; color: var(--text); }

.grid { display:grid; gap:16px; }
.grid-4 { grid-template-columns:repeat(2,1fr); }
.grid-3 { grid-template-columns:1fr; }
@media (min-width:768px) { .grid-4{grid-template-columns:repeat(4,1fr);} .grid-3{grid-template-columns:repeat(3,1fr);} }

.form-grid { display:grid; grid-template-columns:1fr; gap:16px; }
.form-grid-2 { grid-template-columns:1fr; }
.form-grid-3 { grid-template-columns:1fr; }
@media (min-width:640px) { .form-grid-2{grid-template-columns:1fr 1fr;} .form-grid-3{grid-template-columns:repeat(3,1fr);} .fees-grid{grid-template-columns:repeat(3,1fr);} }
@media (min-width:900px) { .fees-grid{grid-template-columns:repeat(5,1fr);} }

.stat-label { font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.08em; color:var(--text-dim); margin:0; }
.stat-value { font-family:'JetBrains Mono',monospace; font-size:26px; font-weight:700; margin:6px 0 0; }
.metal { background:linear-gradient(180deg,var(--silver-1) 0%, var(--silver-2) 45%, var(--silver-3) 60%, var(--silver-1) 100%); -webkit-background-clip:text; background-clip:text; color:transparent; }
.amber-text { color: var(--amber-text); }

.alert-box { background:var(--amber-soft); border:1px solid rgba(217,118,6,0.35); border-radius:16px; padding:16px; display:flex; gap:12px; }
.alert-box .icon { color:var(--amber); margin-top:2px; }
.alert-box .title { font-weight:700; font-size:13px; color:var(--amber-text); margin:0; }

.alert-box li { margin-top:2px; }

table.data-table { width:100%; border-collapse:collapse; font-size:13px; }
table.data-table thead th { text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-faint); padding:10px 20px; font-weight:600; }
table.data-table td { padding:10px 20px; border-top:1px solid var(--border-soft); }
table.data-table td.num { font-family:'JetBrains Mono',monospace; text-align:right; }

.empty-state { text-align:center; padding:72px 16px; }
.empty-state .icon-wrap { color:var(--silver-3); margin-bottom:12px; }
.empty-state h2 { font-family:'Rajdhani',sans-serif; font-weight:700; font-size:19px; color:var(--text); margin:0; }
.empty-state p { font-size:13px; color:var(--text-dim); max-width:440px; margin:8px auto 0; line-height:1.6; }
.empty-state strong { color:var(--cobalt); }

label.field-label { font-size:11px; font-weight:600; color:var(--text-dim); text-transform:uppercase; letter-spacing:.04em; display:block; }
input, select {

input[type=number], input[type=date] { font-family:'JetBrains Mono',monospace; }
input:focus, select:focus { border-color:var(--cobalt); box-shadow:0 0 0 3px rgba(47,127,224,0.18); }
input::placeholder { color:var(--text-faint); }
.hint { font-size:11px; color:var(--text-faint); margin-top:6px; }

.btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; border:none; border-radius:10px; font-weight:700; font-family:'Inter',sans-serif; font-size:13px; cursor:pointer; transition:background .15s, opacity .15s; }
.btn-primary { background:var(--cobalt); color:#08111f; width:100%; padding:13px; }
.btn-primary:hover { background:#4a92e6; }
.btn-primary:disabled { opacity:.35; cursor:not-allowed; }
.btn-primary.inline { width:auto; padding:12px 26px; }

.checkbox-row { display:flex; align-items:center; gap:8px; font-size:13px; color:var(--text-dim); }
.checkbox-row input { width:16px; height:16px; margin:0; accent-color:var(--cobalt); }

.preview-panel { background:linear-gradient(160deg,#0c1626,#070d18); border:1px solid var(--cobalt-soft); border-radius:16px; padding:20px; height:fit-content; }
.preview-row { display:flex; align-items:center; justify-content:space-between; font-size:13px; padding:4px 0; gap: 12px; }
.preview-row .k { color:var(--text-faint); }
.preview-row .v { font-family:'JetBrains Mono',monospace; color:var(--text); text-align:right; }
.preview-row.bold .k { color:var(--text-dim); font-weight:600; }
.preview-row.bold .v { font-weight:700; }
.preview-row.accent .v { color:var(--amber-text); }
.preview-divider { height:1px; background:var(--border); margin:10px 0; }

.list-row { padding:16px 20px; display:flex; align-items:center; justify-content:space-between; gap:16px; border-top:1px solid var(--border-soft); }
.list-row:first-child { border-top:none; }
.list-row .name { font-weight:600; font-size:13px; margin:0; }
.list-row .meta { font-size:11px; color:var(--text-faint); margin:3px 0 0; }
.list-row .meta2 { font-size:11px; color:var(--text-dim); margin:3px 0 0; font-family:'JetBrains Mono',monospace; }
.icon-btn { background:none; border:none; color:var(--text-faint); cursor:pointer; padding:4px; display:flex; flex-shrink:0; }
.icon-btn:hover { color:var(--danger); }

.donut-wrap { text-align:center; flex-shrink:0; }
.donut { width:56px; height:56px; border-radius:999px; display:flex; align-items:center; justify-content:center; }
.donut-inner { width:40px; height:40px; border-radius:999px; background:var(--surface); display:flex; align-items:center; justify-content:center; font-size:10px; font-family:'JetBrains Mono',monospace; font-weight:700; }
.donut-caption { font-size:8px; color:var(--text-faint); margin:2px 0 0; }
.low-warning { color:var(--amber-text); font-size:11px; margin:4px 0 0; }

.section-hint { font-size:12px; color:var(--text-faint); margin:4px 0 12px; line-height:1.5; }

.stock-subtab-btn { padding:9px 16px; border-radius:999px; border:1px solid var(--border); background:var(--surface); color:var(--text-dim); font-size:12px; font-weight:600; cursor:pointer; font-family:'Inter',sans-serif; transition:all .15s; }
.stock-subtab-btn:hover { color:var(--text); }
.stock-subtab-btn.active { border-color:var(--cobalt); color:var(--cobalt); background:var(--cobalt-soft); }

.toast { position:fixed; top:16px; right:16px; z-index:50; max-width:320px; padding:12px 16px; border-radius:10px; font-size:13px; font-weight:600; color:#fff; box-shadow:0 10px 30px rgba(0,0,0,.5); }
.toast.success { background: var(--cobalt-dark); border:1px solid var(--cobalt); }
.toast.error { background:#7a1f2b; border:1px solid var(--danger); }

.brand-footer { border-top:1px solid var(--border); padding:32px 0 44px; margin-top:8px; }
.brand-footer .tagline { text-align:center; font-family:'Rajdhani',sans-serif; font-weight:600; font-size:13px; letter-spacing:.16em; text-transform:uppercase; color:var(--cobalt); margin:0; }
.brand-footer .tagline b { color:var(--amber); font-weight:700; }
.brand-icons { display:flex; justify-content:center; gap:32px; margin-top:22px; flex-wrap:wrap; }
.brand-icon-item { display:flex; flex-direction:column; align-items:center; gap:8px; color:var(--text-dim); }
.brand-icon-item .icon { color:var(--silver-2); }
.brand-icon-item span { font-size:10px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; font-family:'Rajdhani',sans-serif; }

.loading-screen { min-height:60vh; display:flex; align-items:center; justify-content:center; color:var(--text-faint); font-family:'JetBrains Mono',monospace; font-size:13px; letter-spacing:.05em; }
</style>

<body>
<div id="toast-root"></div>
<div id="app-root"><div class="loading-screen">carregando painel...</div></div>

<script>
/* ---------- storage shim (backed by the Google Sheet through Apps Script's
   google.script.run bridge — same get/set({value}) interface as the
   standalone version, so none of the app logic below needed to change) ---------- */
window.storage = {
  get(key) {
    return new Promise((resolve) => {
      google.script.run
        .withSuccessHandler((raw) => resolve(raw === null || raw === undefined ? null : { value: raw }))
        .withFailureHandler(() => resolve(null))
        .getData(key);
    });
  },
  set(key, value) {
    return new Promise((resolve, reject) => {
      google.script.run
        .withSuccessHandler(() => resolve())
        .withFailureHandler((err) => reject(err))
        .setData(key, value);
    });
  },
};

/* ---------- formatting helpers ---------- */
const fmtBRL = (n) => new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(Number.isFinite(n) ? n : 0);
const fmtNum = (n, d = 0) => new Intl.NumberFormat('pt-BR', { minimumFractionDigits: d, maximumFractionDigits: d }).format(Number.isFinite(n) ? n : 0);
const uid = () => Math.random().toString(36).slice(2, 10);
const todayStr = () => new Date().toISOString().slice(0, 10);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* ---------- domain config / constants (identical to the original) ---------- */
const DEFAULT_CONFIG = {
  energyPricePerKWh: 0.85,
  printerPowerWatts: 150,
  laborCostDefaultPerPiece: 3,
  packagingCostDefault: 2,
  platformFees: { shopee: 14, tiktokshop: 8, mercadolivre: 13, whatsapp: 0, direto: 0 },
  machines: [
    { id: 'm1', name: 'Máquina 1', status: 'ativa' },
    { id: 'm2', name: 'Máquina 2', status: 'aguardando' },
    { id: 'm3', name: 'Máquina 3', status: 'aguardando' },
  ],
};

const MACHINE_STATUS = {
  ativa: { label: 'Imprimindo', dot: 'var(--cobalt)' },
  parada: { label: 'Parada', dot: 'var(--silver-3)' },
  aguardando: { label: 'Aguardando instalação', dot: 'var(--amber)' },
  manutencao: { label: 'Manutenção', dot: 'var(--danger)' },
};

const PLATFORM_NAMES = { shopee: 'Shopee', tiktokshop: 'TikTok Shop', mercadolivre: 'Mercado Livre', whatsapp: 'WhatsApp', direto: 'Venda Direta' };

const DEFAULT_SUPPLIES = [
  { id: 'sup-argola-dourada', name: 'Argola para chaveiro (dourada)', qty: 0, unit: 'un.', unitPrice: 0 },
  { id: 'sup-argola-prateada', name: 'Argola para chaveiro (prateada)', qty: 0, unit: 'un.', unitPrice: 0 },
  { id: 'sup-corrente-dourada', name: 'Corrente para chaveiro (dourada)', qty: 0, unit: 'un.', unitPrice: 0 },
  { id: 'sup-corrente-prateada', name: 'Corrente para chaveiro (prateada)', qty: 0, unit: 'un.', unitPrice: 0 },
  { id: 'sup-switch', name: 'Switch', qty: 0, unit: 'un.', unitPrice: 0 },
  { id: 'sup-cola-tecbond', name: 'Cola Tecbond', qty: 0, unit: 'un.', unitPrice: 0 },
  { id: 'sup-plastico-bolha', name: 'Plástico bolha', qty: 0, unit: 'm', unitPrice: 0 },
  { id: 'sup-embalagens', name: 'Embalagens', qty: 0, unit: 'un.', unitPrice: 0 },
];

function computeUnitCost(piece, filamentStock, config, suppliesStock) {
  const fil = filamentStock.find((f) => f.id === piece.filamentId);
  const pricePerKg = fil ? fil.pricePerKg : 0;
  const filamentCost = (piece.weightGrams / 1000) * pricePerKg;
  const energyCost = piece.printHours * (config.printerPowerWatts / 1000) * config.energyPricePerKWh;
  const laborCost = piece.laborCostOverride ?? config.laborCostDefaultPerPiece;
  const packagingCost = piece.packagingCostOverride ?? config.packagingCostDefault;
  const suppliesCost = (piece.supplyUsage || []).reduce((sum, u) => {
    const sup = (suppliesStock || []).find((s) => s.id === u.supplyId);
    return sum + (sup ? (sup.unitPrice || 0) * u.qty : 0);
  }, 0);
  const productionCost = filamentCost + energyCost + laborCost + packagingCost + suppliesCost;
  return { filamentCost, energyCost, laborCost, packagingCost, suppliesCost, productionCost, filamentName: fil ? fil.name : '—' };
}

function computeTotals(sales) {
  const totalRevenue = sales.reduce((a, s) => a + s.totalRevenue, 0);
  const totalProfit = sales.reduce((a, s) => a + s.totalProfit, 0);
  const unitsSold = sales.reduce((a, s) => a + s.quantity, 0);
  const avgMargin = totalRevenue > 0 ? (totalProfit / totalRevenue) * 100 : 0;
  const byPlatform = sales.reduce((acc, s) => {
    acc[s.platform] = acc[s.platform] || { revenue: 0, profit: 0, qty: 0 };
    acc[s.platform].revenue += s.totalRevenue;
    acc[s.platform].profit += s.totalProfit;
    acc[s.platform].qty += s.quantity;
    return acc;
  }, {});
  return { totalRevenue, totalProfit, unitsSold, avgMargin, byPlatform };
}

const TABS = [
  { id: 'overview', label: 'Visão Geral', icon: 'trendingUp' },
  { id: 'sale', label: 'Registrar Venda', icon: 'cart' },
  { id: 'production', label: 'Registrar Produção', icon: 'packagePlus' },
  { id: 'catalog', label: 'Catálogo de Peças', icon: 'layers' },
  { id: 'stock', label: 'Estoque', icon: 'boxes' },
  { id: 'config', label: 'Configurações', icon: 'settings' },
];

/* ---------- icons (thin line-art, matching the logo's style) ---------- */
const ICON_PATHS = {
  trendingUp: '<polyline points="3,17 9,11 13,15 21,6"></polyline><polyline points="15,6 21,6 21,12"></polyline>',
  cart: '<circle cx="9" cy="20" r="1.4"></circle><circle cx="17" cy="20" r="1.4"></circle><path d="M3 4h2l2 11h10l2-8H6.4"></path>',
  packagePlus: '<rect x="3.5" y="8.5" width="12" height="11" rx="1.5"></rect><path d="M3.5 12.5h12"></path><path d="M19.5 5v6M16.5 8h6"></path>',
  layers: '<polygon points="12,4 20,8.5 12,13 4,8.5"></polygon><polyline points="4,12.5 12,17 20,12.5"></polyline><polyline points="4,16.5 12,21 20,16.5"></polyline>',
  boxes: '<rect x="3" y="10" width="8" height="8" rx="1"></rect><rect x="13" y="6" width="8" height="8" rx="1"></rect>',
  settings: '<circle cx="12" cy="12" r="3"></circle><path d="M12 2.5v3M12 18.5v3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M2.5 12h3M18.5 12h3M4.9 19.1l2.1-2.1M17 7l2.1-2.1"></path>',
  alertTriangle: '<path d="M12 3 22 20H2Z"></path><line x1="12" y1="9.5" x2="12" y2="14"></line><circle cx="12" cy="17" r="0.9" fill="currentColor" stroke="none"></circle>',
  trash: '<path d="M4 7h16"></path><path d="M9 7V4.5h6V7"></path><path d="M6.2 7l0.9 12.5a1 1 0 0 0 1 .9h7.8a1 1 0 0 0 1-.9L17.8 7"></path><path d="M10 11v6M14 11v6"></path>',
  pencil: '<path d="M13.5 5.5 18 10 8 20H3.5v-4.5Z"></path><path d="M12 7 17 11.5"></path>',
  x: '<path d="M6 6 18 18"></path><path d="M18 6 6 18"></path>',
  refresh: '<path d="M4 12a8 8 0 0 1 14-5.3L20 8.5"></path><path d="M20 4v4.5h-4.5"></path><path d="M20 12a8 8 0 0 1-14 5.3L4 15.5"></path><path d="M4 20v-4.5h4.5"></path>',
  printerDrip: '<path d="M7.5 3.5h9v5h-9z"></path><path d="M9.5 8.5v2.5h5V8.5"></path><path d="M12 11v3"></path><path d="M9.3 14.5h5.4l-2.7 4z"></path>',
  monitorCube: '<rect x="3" y="4" width="18" height="12" rx="1.2"></rect><path d="M8.5 20h7M12 16v4"></path><path d="M9 9.2 12 7.6l3 1.6v3.2L12 14l-3-1.6z"></path>',
  cubeSpark: '<path d="M6 8.2 12 5l6 3.2v6.8L12 18l-6-3z"></path><path d="M6 8.2 12 11.4l6-3.2"></path><path d="M12 11.4v6.6"></path><path d="M18.5 3 19.2 4.6 20.8 5.3 19.2 6 18.5 7.6 17.8 6 16.2 5.3 17.8 4.6Z"></path>',
};
function Icon(name, cls) {
  return '<svg class="icon ' + (cls || '') + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">' + (ICON_PATHS[name] || '') + '</svg>';
}

/* ---------- app state ---------- */
const state = {
  loading: true,
  tab: 'overview',
  config: DEFAULT_CONFIG,
  catalog: [],
  filamentStock: [],
  finishedStock: {},
  supplies: DEFAULT_SUPPLIES,
  sales: [],
  productionLog: [],
  editingSaleId: null,
  stockSubTab: 'products',
};

function showToast(msg, type) {
  const root = document.getElementById('toast-root');
  root.innerHTML = '<div class="toast ' + (type === 'error' ? 'error' : 'success') + '">' + esc(msg) + '</div>';
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(() => { root.innerHTML = ''; }, 3200);
}

  try { await window.storage.set('inventory', JSON.stringify({ catalog: nextCatalog, filamentStock: nextFilament, finishedStock: nextFinished })); }

}
async function persistSales(next) {
  state.sales = next;
  try { await window.storage.set('sales', JSON.stringify(next)); }

}
async function persistProductionLog(next) {
  state.productionLog = next;
  try { await window.storage.set('productionLog', JSON.stringify(next)); }
  catch (e) { showToast('Não consegui salvar a produção. Tente de novo.', 'error'); }

async function persistSupplies(next) {
  state.supplies = next;
  try { await window.storage.set('supplies', JSON.stringify(next)); }

function renderEfficiencyTable() {
  if (state.catalog.length === 0) return '';
  const rows = state.catalog
    .filter((p) => p.printHours > 0)
    .map((p) => {
      const cost = computeUnitCost(p, state.filamentStock, state.config, state.supplies);
      return {
        name: p.name,
        gramsPerHour: p.weightGrams / p.printHours,
        costPerHour: cost.productionCost / p.printHours,
      };
    });
  if (rows.length === 0) return '';
  rows.sort((a, b) => a.costPerHour - b.costPerHour);

  return '<div class="card" style="margin-bottom:16px">' +
    '<div class="card-header"><h3 class="card-title">Eficiência de impressão (filamento × hora)</h3></div>' +
    '<div style="overflow-x:auto"><table class="data-table"><thead><tr>' +
      '<th>Peça</th><th style="text-align:right">g de filamento / h</th><th style="text-align:right">Custo de produção / h</th>' +
    '</tr></thead><tbody>' +
      rows.map((r, i) =>
        '<tr>' +
          '<td style="font-weight:600">' + esc(r.name) + (i === 0 ? ' <span style="font-size:9px;color:var(--amber-text);font-weight:700;letter-spacing:.05em;vertical-align:middle">MELHOR CUSTO-BENEFÍCIO</span>' : '') + '</td>' +
          '<td class="num">' + fmtNum(r.gramsPerHour, 1) + ' g/h</td>' +
          '<td class="num ' + (i === 0 ? 'amber-text' : '') + '">' + fmtBRL(r.costPerHour) + '/h</td>' +
        '</tr>'
      ).join('') +
    '</tbody></table></div>' +
    '<p style="font-size:11px;color:var(--text-faint);padding:12px 20px 16px;margin:0">Quanto menor o custo de produção por hora de impressão, mais peças (ou lucro) esse molde rende no mesmo tempo de máquina.</p>' +
  '</div>';
}

        lowFilament.map((f) => '<li>Filamento "' + esc(f.name) + '" está com só ' + fmtNum(f.kg, 2) + ' kg</li>').join('') +
        lowFinished.map((p) => '<li>Peça "' + esc(p.name) + '" com ' + fmtNum(state.finishedStock[p.id] || 0) + ' unidade(s) prontas</li>').join('') +
      '</ul></div></div>';

          '<p class="stat-label">' + esc(PLATFORM_NAMES[k] || k) + '</p>' +

          '<p class="font-num amber-text" style="font-size:11px;margin:4px 0 0">lucro ' + fmtBRL(v.profit) + ' · ' + v.qty + ' peça(s)</p>' +

      ? '<p style="padding:24px 20px;font-size:13px;color:var(--text-faint)">Nenhuma venda registrada ainda.</p>'

        '</tr></thead><tbody>' +

          ).join('') +

function reverseSaleStockEffect(sale, finishedStock, filamentStock) {
  let nextFinished = { ...finishedStock };
  let nextFilament = filamentStock;
  if (sale.fromStock) {
    nextFinished[sale.pieceId] = (nextFinished[sale.pieceId] || 0) + sale.quantity;
  } else if (sale.filamentId) {
    nextFilament = filamentStock.map((f) => (f.id === sale.filamentId ? { ...f, kg: f.kg + (sale.filamentUsedKg || 0) } : f));
  }
  return { nextFinished, nextFilament };
}

function bindOverview() {
  document.querySelectorAll('[data-edit-sale]').forEach((btn) => {
    btn.addEventListener('click', () => {
      state.editingSaleId = btn.getAttribute('data-edit-sale');
      state.tab = 'sale';
      refreshTabNav();
      renderMain();
    });
  });
  document.querySelectorAll('[data-delete-sale]').forEach((btn) => {
    btn.addEventListener('click', async () => {
      const id = btn.getAttribute('data-delete-sale');
      const sale = state.sales.find((s) => s.id === id);
      if (!sale) return;
      const { nextFinished, nextFilament } = reverseSaleStockEffect(sale, state.finishedStock, state.filamentStock);
      await persistSales(state.sales.filter((s) => s.id !== id));
      await persistInventory(state.catalog, nextFilament, nextFinished);
      showToast('Venda excluída e o estoque foi ajustado de volta.');
      renderMain();
      refreshTabNav();
    });
  });
}

function computeSalePreviewHTML() {
  const pieceSel = document.getElementById('sale-piece');
  const box = document.getElementById('sale-preview');
  if (!pieceSel || !box) return;
  const piece = state.catalog.find((p) => p.id === pieceSel.value);
  const qty = parseInt(document.getElementById('sale-qty').value) || 1;
  const platform = document.getElementById('sale-platform').value || 'shopee';
  const price = parseFloat(document.getElementById('sale-price').value) || 0;
  const availEl = document.getElementById('sale-available');
  if (!piece) { box.innerHTML = '<p style="color:var(--text-faint);font-size:13px">Selecione uma peça.</p>'; if (availEl) availEl.textContent = ''; return; }
  const preview = computeUnitCost(piece, state.filamentStock, state.config, state.supplies);
  const feePercent = state.config.platformFees[platform] ?? 0;
  const platformFeeCost = price * (feePercent / 100);
  const totalCostUnit = preview.productionCost + platformFeeCost;
  const profitUnit = price - totalCostUnit;
  const marginPct = price > 0 ? (profitUnit / price) * 100 : 0;
  let finishedForDisplay = state.finishedStock;
  if (state.editingSaleId) {
    const editingSale = state.sales.find((s) => s.id === state.editingSaleId);
    if (editingSale) finishedForDisplay = reverseSaleStockEffect(editingSale, state.finishedStock, state.filamentStock).nextFinished;
  }
  const available = finishedForDisplay[piece.id] || 0;
  if (availEl) availEl.textContent = 'Em estoque pronto: ' + available + ' un.';
  box.innerHTML =
    previewRow('Filamento', fmtBRL(preview.filamentCost)) +
    previewRow('Energia', fmtBRL(preview.energyCost)) +
    previewRow('Mão de obra', fmtBRL(preview.laborCost)) +
    previewRow('Embalagem', fmtBRL(preview.packagingCost)) +
    previewRow('Insumos extras', fmtBRL(preview.suppliesCost)) +
    previewRow('Taxa da plataforma (' + feePercent + '%)', fmtBRL(platformFeeCost)) +
    '<div class="preview-divider"></div>' +
    previewRow('Custo total / unidade', fmtBRL(totalCostUnit), true) +
    previewRow('Lucro / unidade', fmtBRL(profitUnit), true, true) +
    previewRow('Margem', fmtNum(marginPct, 1) + '%', true, true) +
    '<div class="preview-divider"></div>' +
    previewRow('Total (' + qty + 'x)', fmtBRL(price * qty), true) +
    previewRow('Lucro total', fmtBRL(profitUnit * qty), true, true);
}

function toggleWhatsappFields() {
  const platform = document.getElementById('sale-platform').value;
  const box = document.getElementById('sale-whatsapp-fields');
  if (box) box.style.display = platform === 'whatsapp' ? 'flex' : 'none';
}

function bindSaleForm() {
  if (!document.getElementById('sale-form')) return;
  ['sale-piece', 'sale-platform', 'sale-qty', 'sale-price'].forEach((id) => {
    const el = document.getElementById(id);
    el.addEventListener('input', computeSalePreviewHTML);
    el.addEventListener('change', computeSalePreviewHTML);
  });
  document.getElementById('sale-platform').addEventListener('change', toggleWhatsappFields);
  toggleWhatsappFields();
  computeSalePreviewHTML();

  const cancelBtn = document.getElementById('sale-cancel-edit');
  if (cancelBtn) cancelBtn.addEventListener('click', () => {
    state.editingSaleId = null;
    renderMain();
  });

  document.getElementById('sale-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const pieceId = document.getElementById('sale-piece').value;
    const piece = state.catalog.find((p) => p.id === pieceId);
    const quantity = parseInt(document.getElementById('sale-qty').value) || 1;
    const platform = document.getElementById('sale-platform').value;
    const price = parseFloat(document.getElementById('sale-price').value) || 0;
    const fromStock = document.getElementById('sale-fromstock').checked;
    const date = document.getElementById('sale-date').value || todayStr();
    const buyerName = platform === 'whatsapp' ? document.getElementById('sale-buyer-name').value.trim() : '';
    const buyerContact = platform === 'whatsapp' ? document.getElementById('sale-buyer-contact').value.trim() : '';

    if (!piece || price <= 0 || quantity <= 0) {
      showToast('Preencha peça, quantidade e valor de venda.', 'error');
      return;
    }

    const editingId = state.editingSaleId;
    const editingSale = editingId ? state.sales.find((s) => s.id === editingId) : null;

    let baseFinished = state.finishedStock;
    let baseFilament = state.filamentStock;
    if (editingSale) {
      const reversed = reverseSaleStockEffect(editingSale, state.finishedStock, state.filamentStock);
      baseFinished = reversed.nextFinished;
      baseFilament = reversed.nextFilament;
    }

    const preview = computeUnitCost(piece, baseFilament, state.config, state.supplies);
    const feePercent = state.config.platformFees[platform] ?? 0;
    const platformFeeCost = price * (feePercent / 100);
    const totalCostUnit = preview.productionCost + platformFeeCost;
    const profitUnit = price - totalCostUnit;

    let nextFinished = { ...baseFinished };
    let nextFilament = baseFilament;
    let filamentUsedKg = 0;

    if (fromStock) {
      const have = nextFinished[piece.id] || 0;
      if (have < quantity) showToast('Atenção: só havia ' + have + ' unidade(s) no estoque pronto dessa peça — o estoque foi zerado.', 'error');
      nextFinished[piece.id] = Math.max(0, have - quantity);
    } else {
      const fil = baseFilament.find((f) => f.id === piece.filamentId);
      if (fil) {
        filamentUsedKg = (piece.weightGrams * quantity) / 1000;
        nextFilament = baseFilament.map((f) => (f.id === fil.id ? { ...f, kg: Math.max(0, f.kg - filamentUsedKg) } : f));
        if (fil.kg < filamentUsedKg) showToast('O filamento "' + fil.name + '" não tinha o suficiente — registre a compra de um rolo novo.', 'error');
      }
    }

    const totalRevenue = price * quantity;
    const totalProfit = profitUnit * quantity;
    const sale = {
      id: editingId || uid(), date, pieceId: piece.id, pieceName: piece.name, quantity, platform,
      unitPrice: price, totalRevenue,
      filamentCost: preview.filamentCost * quantity,
      energyCost: preview.energyCost * quantity,
      laborCost: preview.laborCost * quantity,
      packagingCost: preview.packagingCost * quantity,
      platformFeeCost: platformFeeCost * quantity,
      totalCost: totalCostUnit * quantity,
      totalProfit,
      fromStock,
      filamentId: piece.filamentId,
      filamentUsedKg,
      buyerName, buyerContact,
    };

    const nextSales = editingId ? state.sales.map((s) => (s.id === editingId ? sale : s)) : [...state.sales, sale];
    await persistSales(nextSales);
    await persistInventory(state.catalog, nextFilament, nextFinished);
    showToast(editingId
      ? 'Venda atualizada: ' + fmtBRL(totalRevenue) + ' faturados, ' + fmtBRL(totalProfit) + ' de lucro.'
      : 'Venda registrada: ' + fmtBRL(totalRevenue) + ' faturados, ' + fmtBRL(totalProfit) + ' de lucro.');
    state.editingSaleId = null;
    renderMain();
    refreshTabNav();
  });
}

function renderProductionDraftList() {
  if (productionDraft.length === 0) return '';
  return '<div style="display:flex;flex-direction:column;gap:8px;margin-top:4px">' +
    productionDraft.map((line, idx) => {

function computeProductionPreviewHTML() {
  const pieceSel = document.getElementById('production-piece');
  const box = document.getElementById('production-preview');
  if (!pieceSel || !box) return;
  const piece = state.catalog.find((p) => p.id === pieceSel.value);
  const qty = parseInt(document.getElementById('production-qty').value) || 1;
  if (!piece) { box.innerHTML = ''; return; }
  const preview = computeUnitCost(piece, state.filamentStock, state.config, state.supplies);
  box.innerHTML =
    '<div style="background:#0B1424;border:1px solid var(--border);border-radius:10px;padding:14px;font-size:13px">' +
      '<p style="color:var(--text-dim);margin:0">Vai consumir <span class="font-num" style="font-weight:600;color:var(--text)">' + fmtNum((piece.weightGrams * qty) / 1000, 3) + ' kg</span> de ' + esc(preview.filamentName) + '</p>' +
      '<p style="color:var(--text-dim);margin:6px 0 0">Custo estimado da leva: <span class="font-num" style="font-weight:600;color:var(--text)">' + fmtBRL(preview.productionCost * qty) + '</span></p>' +
    '</div>';
}

function bindProductionDraftRemoveButtons() {
  document.querySelectorAll('[data-remove-draft]').forEach((btn) => {
    btn.addEventListener('click', () => {
      const idx = parseInt(btn.getAttribute('data-remove-draft'), 10);
      productionDraft.splice(idx, 1);
      document.getElementById('production-draft-list').innerHTML = renderProductionDraftList();
      bindProductionDraftRemoveButtons();
    });
  });
}

function bindProductionForm() {
  if (!document.getElementById('production-form')) return;
  ['production-piece', 'production-qty'].forEach((id) => {
    const el = document.getElementById(id);
    el.addEventListener('input', computeProductionPreviewHTML);
    el.addEventListener('change', computeProductionPreviewHTML);
  });
  computeProductionPreviewHTML();
  bindProductionDraftRemoveButtons();

  document.getElementById('production-add-line').addEventListener('click', () => {
    const pieceSel = document.getElementById('production-piece');
    const qtyInput = document.getElementById('production-qty');
    const quantity = parseInt(qtyInput.value) || 0;
    if (!pieceSel.value || quantity <= 0) {
      showToast('Selecione uma peça e uma quantidade válida antes de adicionar.', 'error');
      return;
    }
    productionDraft.push({ pieceId: pieceSel.value, quantity });
    qtyInput.value = 1;
    document.getElementById('production-draft-list').innerHTML = renderProductionDraftList();
    bindProductionDraftRemoveButtons();
    computeProductionPreviewHTML();
  });

  document.getElementById('production-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const date = document.getElementById('production-date').value || todayStr();
    const currentPieceId = document.getElementById('production-piece').value;
    const currentQty = parseInt(document.getElementById('production-qty').value) || 0;
    const lines = [...productionDraft];
    if (currentPieceId && currentQty > 0) lines.push({ pieceId: currentPieceId, quantity: currentQty });
    if (lines.length === 0) {
      showToast('Adicione ao menos uma peça e quantidade.', 'error');
      return;
    }

    let nextFilament = state.filamentStock;
    let nextFinished = { ...state.finishedStock };
    const newEntries = [];
    const insufficient = [];
    const summaryParts = [];

    for (const line of lines) {
      const piece = state.catalog.find((p) => p.id === line.pieceId);
      if (!piece) continue;
      const preview = computeUnitCost(piece, nextFilament, state.config, state.supplies);
      const fil = nextFilament.find((f) => f.id === piece.filamentId);
      const usedKg = (piece.weightGrams * line.quantity) / 1000;
      if (fil) {
        if (fil.kg < usedKg && !insufficient.includes(fil.name)) insufficient.push(fil.name);
        nextFilament = nextFilament.map((f) => (f.id === fil.id ? { ...f, kg: Math.max(0, f.kg - usedKg) } : f));
      }
      nextFinished[piece.id] = (nextFinished[piece.id] || 0) + line.quantity;
      newEntries.push({ id: uid(), date, pieceId: piece.id, pieceName: piece.name, quantity: line.quantity, filamentUsedKg: usedKg, cost: preview.productionCost * line.quantity });
      summaryParts.push(line.quantity + ' ' + piece.name);
    }

    await persistProductionLog([...state.productionLog, ...newEntries]);
    await persistInventory(state.catalog, nextFilament, nextFinished);
    let msg = summaryParts.join(' + ') + ' foram para o estoque pronto.';
    if (insufficient.length) msg = 'Atenção: filamento insuficiente para ' + insufficient.join(', ') + '. ' + msg;
    showToast(msg, insufficient.length ? 'error' : 'success');
    renderMain();
    refreshTabNav();
  });
}

  return piece.supplyUsage.map((u) => {
    const sup = state.supplies.find((s) => s.id === u.supplyId);
    return sup ? esc(sup.name) + ' × ' + u.qty : null;

}

function computeCatalogPreviewHTML() {
  const box = document.getElementById('catalog-preview');
  if (!box) return;
  const weightGrams = document.getElementById('catalog-weight').value;
  const printHours = document.getElementById('catalog-hours').value;
  const filamentId = document.getElementById('catalog-filament').value;
  const laborOverride = document.getElementById('catalog-labor').value;
  const packagingOverride = document.getElementById('catalog-packaging').value;
  if (weightGrams && printHours && filamentId) {
    const previewCost = computeUnitCost({
      weightGrams: parseFloat(weightGrams) || 0,
      printHours: parseFloat(printHours) || 0,
      filamentId,
      laborCostOverride: laborOverride ? parseFloat(laborOverride) : null,
      packagingCostOverride: packagingOverride ? parseFloat(packagingOverride) : null,
      supplyUsage: catalogSupplyDraft,
    }, state.filamentStock, state.config, state.supplies);
    box.innerHTML =
      '<div style="background:#0B1424;border:1px solid var(--border);border-radius:10px;padding:14px">' +
        '<p style="font-size:12px;color:var(--text-faint);margin:0">Custo de produção estimado</p>' +
        '<p class="font-num metal" style="font-size:20px;font-weight:700;margin:2px 0 0">' + fmtBRL(previewCost.productionCost) + '</p>' +
        (previewCost.suppliesCost > 0 ? '<p style="font-size:11px;color:var(--amber-text);margin:6px 0 0">inclui ' + fmtBRL(previewCost.suppliesCost) + ' de insumos extras</p>' : '') +
        '<p style="font-size:11px;color:var(--text-faint);margin:6px 0 0">Para 3x de margem, venda por volta de ' + fmtBRL(previewCost.productionCost * 3) + '</p>' +
      '</div>';
  } else {
    box.innerHTML = '';
  }
}

function bindCatalogTab() {

    el.addEventListener('input', computeCatalogPreviewHTML);

    supplyAddBtn.addEventListener('click', () => {
      const sel = document.getElementById('catalog-supply-select');
      const qtyInput = document.getElementById('catalog-supply-qty');

      if (!sel.value || qty <= 0) {

      packagingCostOverride: packagingOverride ? parseFloat(packagingOverride) : null,

        '<div><label class="field-label">Nome</label><input id="supply-name" placeholder="Ex: Argola para chaveiro (dourada)"></div>' +
        '<div class="form-grid form-grid-3">' +
          '<div><label class="field-label">Quantidade</label><input type="number" min="0" step="1" id="supply-qty" placeholder="0" class="font-num"></div>' +
          '<div><label class="field-label">Unidade</label><input id="supply-unit" placeholder="un." value="un."></div>' +
          '<div><label class="field-label">Preço/un.</label><input type="number" min="0" step="0.01" id="supply-price" placeholder="0,00" class="font-num"></div>' +
        '</div>' +
        '<button type="submit" class="btn btn-primary">Adicionar</button>' +
      '</form>' +
    '</div>'
  );
}

function bindSupplyRowActions() {
  document.querySelectorAll('[data-supply-save]').forEach((btn) => {
    btn.addEventListener('click', async () => {
      const id = btn.getAttribute('data-supply-save');
      const qtyInput = document.querySelector('[data-supply-qty-input="' + id + '"]');
      const priceInput = document.querySelector('[data-supply-price-input="' + id + '"]');
      const qty = Math.max(0, parseInt(qtyInput.value) || 0);
      const unitPrice = Math.max(0, parseFloat(priceInput.value) || 0);
      await persistSupplies(state.supplies.map((s) => (s.id === id ? { ...s, qty, unitPrice } : s)));
      showToast('Estoque registrado.');
      document.getElementById('supplies-list').innerHTML = renderSuppliesRows();
      bindSupplyRowActions();
    });
  });
  document.querySelectorAll('[data-delete-supply]').forEach((btn) => {
    btn.addEventListener('click', async () => {
      const id = btn.getAttribute('data-delete-supply');
      await persistSupplies(state.supplies.filter((s) => s.id !== id));
      document.getElementById('supplies-list').innerHTML = renderSuppliesRows();
      bindSupplyRowActions();
    });
  });
}

function bindSuppliesSection() {
  bindSupplyRowActions();
  const form = document.getElementById('supplies-form');
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const name = document.getElementById('supply-name').value.trim();
    const qty = parseFloat(document.getElementById('supply-qty').value) || 0;
    const unit = document.getElementById('supply-unit').value.trim() || 'un.';
    const unitPrice = parseFloat(document.getElementById('supply-price').value) || 0;
    if (!name) { showToast('Digite o nome do item.', 'error'); return; }
    const existing = state.supplies.find((s) => s.name.toLowerCase() === name.toLowerCase());
    let next;
    if (existing) {
      next = state.supplies.map((s) => (s.id === existing.id ? { ...s, qty: s.qty + qty, unit, unitPrice } : s));
      showToast('Adicionado mais ' + qty + ' ' + unit + ' em "' + name + '".');
    } else {
      next = [...state.supplies, { id: uid(), name, qty, unit, unitPrice }];
      showToast('"' + name + '" cadastrado no estoque.');
    }
    await persistSupplies(next);
    document.getElementById('supply-name').value = '';
    document.getElementById('supply-qty').value = '';
    document.getElementById('supply-unit').value = 'un.';
    document.getElementById('supply-price').value = '';
    document.getElementById('supplies-list').innerHTML = renderSuppliesRows();
    bindSupplyRowActions();
  });
}

/* -- filamento -- */
function renderFilamentListRows() {
  if (state.filamentStock.length === 0) return '<p style="padding:32px 20px;font-size:13px;color:var(--text-faint)">Nenhum filamento cadastrado ainda.</p>';
  return state.filamentStock.map((f) => {
    const pct = Math.min(100, Math.round((f.kg / 1) * 100));
    return (
      '<div class="list-row" data-filament-row="' + f.id + '">' +
        '<div class="donut-wrap">' +
          '<div class="donut" style="background:conic-gradient(var(--cobalt) ' + (pct * 3.6) + 'deg, var(--border) 0deg)"><div class="donut-inner">' + pct + '%</div></div>' +
          '<p class="donut-caption">rolo de 1kg</p>' +
        '</div>' +
        '<div style="flex:1">' +
          '<p class="name">' + esc(f.name) + '</p>' +
          '<p class="meta2">' + fmtNum(f.kg, 3) + ' kg restantes · ' + fmtBRL(f.pricePerKg) + '/kg</p>' +
          (f.kg < 0.2 ? '<p class="low-warning">estoque baixo — hora de comprar um rolo novo</p>' : '') +
        '</div>' +
        '<button class="icon-btn" data-delete-filament="' + f.id + '">' + Icon('trash', 'icon-sm') + '</button>' +
      '</div>'
    );
  }).join('');
}

function renderFilamentSection() {
  return (
    '<div id="filament-grid" style="display:grid;gap:24px;grid-template-columns:1fr">' +
      '<style>@media(min-width:1024px){#filament-grid{grid-template-columns:1fr 340px}}</style>' +
      '<div class="card">' +
        '<div class="card-header"><h3 class="card-title">Rolos em estoque</h3></div>' +
        '<div id="filament-list">' + renderFilamentListRows() + '</div>' +
      '</div>' +
      '<form id="filament-form" class="card card-pad" style="display:flex;flex-direction:column;gap:16px;height:fit-content">' +
        '<h3 class="card-title">Registrar rolo de filamento</h3>' +
        '<p class="hint" style="margin-top:-4px">Se o nome já existir, o painel só soma a quantidade nova ao estoque.</p>' +
        '<div><label class="field-label">Nome / cor</label><input id="filament-name" placeholder="Ex: PLA Branco"></div>' +
        '<div class="form-grid form-grid-2">' +
          '<div><label class="field-label">Quantidade (kg)</label><input type="number" step="0.01" id="filament-kg" placeholder="1" class="font-num"></div>' +
          '<div><label class="field-label">Preço por kg</label><input type="number" step="0.01" id="filament-price" placeholder="0,00" class="font-num"></div>' +
        '</div>' +
        '<button type="submit" class="btn btn-primary">Adicionar ao estoque</button>' +
      '</form>' +
    '</div>'
  );
}

function bindFilamentListDeleteButtons() {
  document.querySelectorAll('[data-delete-filament]').forEach((btn) => {
    btn.addEventListener('click', async () => {
      const id = btn.getAttribute('data-delete-filament');
      await persistInventory(state.catalog, state.filamentStock.filter((f) => f.id !== id), state.finishedStock);
      document.getElementById('filament-list').innerHTML = renderFilamentListRows();
      bindFilamentListDeleteButtons();
      refreshTabNav();
    });
  });
}

function bindFilamentTab() {
  document.getElementById('filament-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const name = document.getElementById('filament-name').value.trim();
    const kg = document.getElementById('filament-kg').value;
    const pricePerKg = document.getElementById('filament-price').value;
    if (!name || !kg || !pricePerKg) {
      showToast('Preencha nome, quantidade e preço.', 'error');
      return;
    }
    const existing = state.filamentStock.find((f) => f.name.toLowerCase() === name.toLowerCase());
    let next;
    if (existing) {
      next = state.filamentStock.map((f) => (f.id === existing.id ? { ...f, kg: f.kg + parseFloat(kg), pricePerKg: parseFloat(pricePerKg) } : f));
      showToast('Adicionado mais ' + kg + ' kg em "' + name + '".');
    } else {
      next = [...state.filamentStock, { id: uid(), name, kg: parseFloat(kg), pricePerKg: parseFloat(pricePerKg) }];
      showToast('Filamento "' + name + '" cadastrado.');
    }
    await persistInventory(state.catalog, next, state.finishedStock);
    document.getElementById('filament-name').value = '';
    document.getElementById('filament-kg').value = '';
    document.getElementById('filament-price').value = '';
    document.getElementById('filament-list').innerHTML = renderFilamentListRows();
    bindFilamentListDeleteButtons();
    refreshTabNav();
  });
  bindFilamentListDeleteButtons();
}

/* ---------- config tab ---------- */
function configField(id, label, value) {
  return '<div><label class="field-label">' + esc(label) + '</label><input type="number" step="0.01" id="' + id + '" value="' + value + '" class="font-num"></div>';
}

function renderConfigTab() {
  const c = state.config;
  const machinesHtml = c.machines.map((m) =>
    '<div style="display:flex;align-items:center;justify-content:space-between;gap:16px">' +
      '<span style="font-size:13px;font-weight:600">' + esc(m.name) + '</span>' +
      '<select data-machine-id="' + m.id + '" class="machine-status-select" style="width:auto">' +
        '<option value="ativa"' + (m.status === 'ativa' ? ' selected' : '') + '>Imprimindo</option>' +
        '<option value="parada"' + (m.status === 'parada' ? ' selected' : '') + '>Parada</option>' +
        '<option value="aguardando"' + (m.status === 'aguardando' ? ' selected' : '') + '>Aguardando instalação</option>' +
        '<option value="manutencao"' + (m.status === 'manutencao' ? ' selected' : '') + '>Manutenção</option>' +
      '</select>' +
    '</div>'
  ).join('');

  return (
    '<form id="config-form" style="max-width:640px;display:flex;flex-direction:column;gap:20px">' +
      '<div class="card card-pad">' +
        '<h3 class="card-title">Custos fixos</h3>' +
        '<p class="section-hint">Esses números alimentam o cálculo automático de todas as peças. Ajuste sempre que sua conta de luz ou o preço do filamento mudar.</p>' +
        '<div class="form-grid form-grid-2">' +
          configField('config-energy', 'Preço da energia (R$/kWh)', c.energyPricePerKWh) +
          configField('config-power', 'Potência média da impressora (W)', c.printerPowerWatts) +
          configField('config-labor', 'Mão de obra padrão (R$/peça)', c.laborCostDefaultPerPiece) +
          configField('config-packaging', 'Embalagem padrão (R$/peça)', c.packagingCostDefault) +
        '</div>' +
      '</div>' +
      '<div class="card card-pad">' +
        '<h3 class="card-title">Taxas das plataformas (%)</h3>' +
        '<p class="section-hint">Confira o percentual atual no painel de vendedor de cada plataforma — elas mudam de vez em quando.</p>' +
        '<div class="form-grid fees-grid">' +
          configField('config-fee-shopee', 'Shopee', c.platformFees.shopee) +
          configField('config-fee-tiktok', 'TikTok Shop', c.platformFees.tiktokshop) +
          configField('config-fee-mercadolivre', 'Mercado Livre', c.platformFees.mercadolivre) +
          configField('config-fee-whatsapp', 'WhatsApp', c.platformFees.whatsapp) +
          configField('config-fee-direto', 'Venda Direta', c.platformFees.direto) +
        '</div>' +
      '</div>' +
      '<div class="card card-pad">' +
        '<h3 class="card-title">Frota de impressoras</h3>' +
        '<div style="display:flex;flex-direction:column;gap:14px;margin-top:14px">' + machinesHtml + '</div>' +
      '</div>' +
      '<button type="submit" class="btn btn-primary inline">Salvar configurações</button>' +
    '</form>'
  );
}

function bindConfigTab() {
  document.getElementById('config-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const next = {
      ...state.config,
      energyPricePerKWh: parseFloat(document.getElementById('config-energy').value) || 0,
      printerPowerWatts: parseFloat(document.getElementById('config-power').value) || 0,
      laborCostDefaultPerPiece: parseFloat(document.getElementById('config-labor').value) || 0,
      packagingCostDefault: parseFloat(document.getElementById('config-packaging').value) || 0,
      platformFees: {
        shopee: parseFloat(document.getElementById('config-fee-shopee').value) || 0,
        tiktokshop: parseFloat(document.getElementById('config-fee-tiktok').value) || 0,
        mercadolivre: parseFloat(document.getElementById('config-fee-mercadolivre').value) || 0,
        whatsapp: parseFloat(document.getElementById('config-fee-whatsapp').value) || 0,
        direto: parseFloat(document.getElementById('config-fee-direto').value) || 0,
      },
      machines: state.config.machines.map((m) => {
        const sel = document.querySelector('.machine-status-select[data-machine-id="' + m.id + '"]');
        return { ...m, status: sel ? sel.value : m.status };
      }),
    };
    await persistConfig(next);
    showToast('Configurações salvas.');
    refreshHeader();
  });
}

/* ---------- shell mount / refresh / dispatch ---------- */
function refreshHeader() {
  document.getElementById('header-slot').innerHTML = renderHeader(state.config);
  const refreshBtn = document.getElementById('refresh-data-btn');
  if (refreshBtn) refreshBtn.addEventListener('click', () => location.reload());
}
function refreshTabNav() {
  document.getElementById('tabnav-slot').innerHTML = renderTabNav(state.tab, currentAlerts());
  bindTabNav();
}
function bindTabNav() {
  document.querySelectorAll('.tab-btn').forEach((btn) => {
    btn.addEventListener('click', () => {
      state.tab = btn.getAttribute('data-tab');
      state.editingSaleId = null;
      refreshTabNav();
      renderMain();
    });
  });
}
function renderMain() {
  const slot = document.getElementById('main-slot');
  switch (state.tab) {
    case 'overview': slot.innerHTML = renderOverview(); bindOverview(); break;
    case 'sale': slot.innerHTML = renderSaleForm(); bindSaleForm(); break;
    case 'production': slot.innerHTML = renderProductionForm(); bindProductionForm(); break;
    case 'catalog': slot.innerHTML = renderCatalogTab(); bindCatalogTab(); break;
    case 'stock': slot.innerHTML = renderStockTab(); bindStockTab(); break;
    case 'config': slot.innerHTML = renderConfigTab(); bindConfigTab(); break;
  }
}
function mountShell() {
  document.getElementById('app-root').innerHTML =
    '<div id="header-slot"></div>' +
    '<div id="tabnav-slot"></div>' +
    '<main class="content"><div class="wrap" id="main-slot"></div></main>' +
    '<div id="footer-slot"></div>';
  refreshHeader();
  refreshTabNav();
  renderMain();
  document.getElementById('footer-slot').innerHTML = renderFooter();
}

/* ---------- init ---------- */
(async function init() {
  try {
    const c = await window.storage.get('config');
    if (c && c.value) state.config = { ...DEFAULT_CONFIG, ...JSON.parse(c.value) };
  } catch (e) {}
  try {
    const inv = await window.storage.get('inventory');
    if (inv && inv.value) {
      const parsed = JSON.parse(inv.value);
      state.catalog = parsed.catalog || [];
      state.filamentStock = parsed.filamentStock || [];
      state.finishedStock = parsed.finishedStock || {};
    }
  } catch (e) {}
  try {
    const s = await window.storage.get('sales');
    if (s && s.value) state.sales = JSON.parse(s.value);
  } catch (e) {}
  try {
    const p = await window.storage.get('productionLog');
    if (p && p.value) state.productionLog = JSON.parse(p.value);
  } catch (e) {}
  try {
    const sup = await window.storage.get('supplies');
    if (sup && sup.value) state.supplies = JSON.parse(sup.value);
  } catch (e) {}
  state.loading = false;
  mountShell();
})();
</script>
</body>
</html>
